# Nino ortak altyazı havuzu. Canlıya alma adımları README.md'de.
name = "nino-pool"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "nino-pool"
# Canlı veritabanı (Cloudflare D1, EEUR).
database_id = "2d7c0031-0899-4f72-ad6a-802580e34369"
migrations_dir = "migrations"

[vars]
# Günde kabul edilen en çok satır (18 Kasım 2026'dan beri Workers Paid: ayda 50 milyon yazma dahil).
# Aşılınca sunucu 429 ile ertesi güne kadar beklemesini söyler; satırlar cihazlarda kuyrukta bekler, kaybolmaz.
DAILY_LINE_BUDGET = "300000"
# Bir kurulumun saatte gönderebileceği en çok parça.
INSTALL_HOURLY_BATCHES = "60"
# Nino yardımcısı: Claude Haiku 5.5. Anahtar sır olarak durur (wrangler secret put ANTHROPIC_API_KEY); yoksa yardımcı kapalıdır.
ASSISTANT_PROVIDER = "anthropic"
# Günlük en çok harcama (dolar). Aynı ilk sorular hazır cevaptan ücretsiz verilir.
ASSISTANT_DAILY_USD = "2"

# Çeviri havuzu (src/translate.js): anında çeviri ve 30 dakikada bir bağlamla gözden geçirme Claude Sonnet.
# Günlük en çok harcama (dolar); dolunca uygulamalar kendi çevirileriyle devam eder.
TRANSLATE_DAILY_USD = "20"
# Claude yalnız bu oyunlarda çevirir (oyun kimliği bu parçalardan birini içeriyorsa); "*" bütün oyunlar.
TRANSLATE_GAMES = "grand-theft-auto-vi,gta-vi,gta-6,gta6,mafia"
# Uygulama sunucunun çevirisini en çok bu kadar bekler (milisaniye), sonra kendi çevirisini gösterir.
TRANSLATE_DEADLINE_MS = "900"
# Uygulamalar oyunun yeni çevirilerini bu aralıkla çeker (saniye).
TRANSLATE_SYNC_SECONDS = "180"
# Havuz öncelikli oyunlar: uygulama bu oyunlarda satırı önce sunucuya sorar, kullanıcının kendi motorunu (Gemini,
# DeepL, yapay zekâ) hiç kullanmaz; POOL_FIRST_DEADLINE_MS içinde cevap gelmezse yalnız ücretsiz yerel çeviriye düşer.
POOL_FIRST_GAMES = "grand-theft-auto-vi,gta-vi,gta-6,gta6"
POOL_FIRST_DEADLINE_MS = "3000"

# Günde bir: eski parça kimliklerini (tekrar sayılmasın diye tutulur) temizler. 30 dakikada bir: yeni çevirileri gözden geçirir.
[triggers]
crons = ["17 3 * * *", "*/30 * * * *"]

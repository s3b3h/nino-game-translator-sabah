  <div id="demo-badge" class="hidden"><b data-i18n="demoBadge"></b><span data-i18n="demoHint"></span></div>

  <div id="source-tip" class="hidden"><b data-i18n="sourceSwitchTitle"></b><span data-i18n="sourceSwitchHint"></span><span class="close" data-i18n="sourceSwitchClose"></span></div>

  <div id="panel">
    <div class="p-top">
      <img class="logo" src="logo.png" alt="">
      <div class="brand" data-i18n="panelTitle"></div>
      <span id="app-version" class="ver"></span>
    </div>

    <!-- Büyük durum: bağlantının durumuna göre (data-state) renk ve yazı değişir. -->
    <div class="tile hero">
      <div class="ring"><i></i></div>
      <div class="hero-text">
        <div class="h-title"><span class="s-ok" data-i18n="heroOk"></span><span class="s-wait" data-i18n="heroWait"></span><span class="s-bad" data-i18n="heroBad"></span></div>
        <div class="h-sub"><span id="st-conn">-</span> · <span id="st-server">-</span></div>
        <div class="h-sub"><span data-i18n="hdmi"></span> <span id="st-hdmi">-</span> <span id="st-video"></span></div>
      </div>
    </div>

    <!-- Son altyazı, TV'de göründüğü gibi. -->
    <div class="p-preview">
      <div class="p-label" data-i18n="previewLabel"></div>
      <div class="screen"><span id="st-last" class="sub empty" data-i18n="previewEmpty"></span></div>
    </div>

    <!-- Kumanda: yön tuşları ve renkli tuşlar çizilir, ne yaptıkları yanında. -->
    <div class="p-remote">
      <div class="dpad"><b class="u">▲</b><b class="d">▼</b><b class="l">◀</b><b class="r">▶</b><b class="ok">OK</b></div>
      <div class="r-list">
        <div><b>OK</b><span data-i18n="rOk"></span></div>
        <div><b>◀ ▶</b><span data-i18n="rLR"></span></div>
        <div><b>▲ ▼</b><span data-i18n="rUD"></span></div>
        <div><b>0–4</b><span data-i18n="rNum"></span></div>
      </div>
    </div>
    <div class="p-colors">
      <div><i class="red"></i><span data-i18n="rRed"></span></div>
      <div><i class="green"></i><span data-i18n="rGreen"></span></div>
      <div><i class="blue"></i><span data-i18n="rBlue"></span></div>
    </div>

    <div class="p-diag"><span data-i18n="diagnostics"></span> <span id="st-diag">-</span></div>
    <div id="keys" style="display: none" data-i18n="keys"></div>

# Nino Game Translator, iPhone uygulaması (CouchSubs'tan türetildi): bilgisayarın yerine telefon PS5'e bağlanır, altyazıyı okur, çevirir ve TV'ye (ya da kendi
# ekranına) gönderir. Proje dosyası XcodeGen ile üretilir: cd couchsubs-ios && xcodegen
# Remote Play kütüphanesi önce derlenmeli: scripts/build-chiaki-ios.sh (bkz. docs/ios-plan.md).
name: CouchSubs
options:
  bundleIdPrefix: com.ninotranslator
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
configFiles:
  # Anahtarlar Config/Secrets.xcconfig'te (gitignore'da); yoksa ilgili özellik kapalı derlenir.
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.5.2"
    CURRENT_PROJECT_VERSION: "20"
    # Nino: Apple geliştirici takımı burada değil; gerçek iPhone'a kurarken Xcode'da kendi takımınızı seçin
    # (Signing & Capabilities) ya da DEVELOPMENT_TEAM=... ile derleyin. Simülatör imza istemez.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # libchiaki ve bağımlılıkları yalnız arm64 için derleniyor (cihaz ve Apple Silicon simülatörü).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  CouchSubsCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  # Nino: Firebase (Analytics, Crashlytics) ve Meta App Events kaldırıldı; Nino hiçbir ölçüm ya da izleme yapmaz.
  # Xbox ev yayını (Beta): Google libwebrtc'nin hazır iOS derlemesi (BSD-3). Görüntü VideoToolbox'la çözülür.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 150.0.0
targets:
  CouchSubs:
    type: application
    platform: iOS
    sources:
      - CouchSubs
      # Mac uygulamasıyla ortak arayüz parçaları (tasarım değerleri, bileşenler, PSN giriş sayfası).
      - path: ../mac/CouchSubs/UI/Theme.swift
      - path: ../mac/CouchSubs/UI/Components.swift
      # Nino: cam yüzeyler ve arka plan (Components.swift bunları kullanır).
      - path: ../mac/CouchSubs/UI/NinoStyle.swift
      - path: ../mac/CouchSubs/UI/LoginWebView.swift
      # Altyazı bölgesinin canlı önizlemesi (sürüklenen çerçeve).
      - path: ../mac/CouchSubs/UI/RegionPreview.swift
      # Nino: Arapça çeviri sağdan sola (Mac'le ortak).
      - path: ../mac/CouchSubs/UI/RightToLeft.swift
      # Nino: altyazının yazı tipi (Mac'le ortak) ve dosyaları (OFL; TV sayfasıyla aynı, lisanslarıyla).
      - path: ../mac/CouchSubs/UI/SubtitleFontStyle.swift
      - path: ../tv-webos/fonts
        type: folder
        buildPhase: resources
      # Ekran metinleri Mac uygulamasıyla aynı katalogda (Türkçe).
      - path: ../mac/CouchSubs/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../design/tokens.json
        buildPhase: resources
      # Nino: "Nino'ya Sor" robotu (göz açık ve kırpma karesi); design/bot-png'den doğrudan pakete kopyalanır.
      - path: ../design/bot-png/nino-bot-256.png
        buildPhase: resources
      - path: ../design/bot-png/nino-bot-blink-256.png
        buildPhase: resources
      # Robot, "yazıyor" noktaları ve robotun metinleri (Mac'le ortak).
      - path: ../mac/CouchSubs/UI/NinoBot.swift
      - path: Config
        buildPhase: none
    dependencies:
      - package: CouchSubsCore
      - package: RemotePlay
      - package: WebRTC
        product: WebRTC
    postBuildScripts:
      # Telefondan TV kurulumu: Samsung paketi kaynaktan, Android TV ve LG paketleri son GitHub sürümünden
      # (scripts/ios-tv-packages.sh; indirilemezse önceki indirilen kullanılır).
      - name: TV paketleri
        basedOnDependencyAnalysis: false
        script: |
          "${PROJECT_DIR}/../scripts/ios-tv-packages.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
    info:
      path: CouchSubs/Info.plist
      properties:
        # Kullanıcı isteği: ana ekranda da tam ad (iPhone sığmazsa sonunu kısaltır).
        CFBundleDisplayName: Nino Game Translator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, tr, ar, hi, id, th, vi, ur, bn, ms, fil, nl]
        LSApplicationCategoryType: public.app-category.utilities
        # Yalnız standart şifreleme (TLS, Remote Play'in standart AES'i): ihracat beyanı her yüklemede sorulmasın.
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Nino connects to your PS5 and TV on the home network to read and send translated subtitles, and installs and updates its TV app on your TV.
        # WebRTC kitaplığı kamera ve mikrofon arayüzlerini içerir; kamera hiç açılmaz. Xbox oyun sesi çalınırken WebRTC ses birimi mikrofon iznini sorabilir; yerel ses parçası olmadığından ses gönderilmez.
        NSMicrophoneUsageDescription: Nino never records or sends your voice. To play the Xbox game sound on this iPhone, the streaming library opens the audio system, which may ask for microphone access; you can decline and the sound still plays.
        NSCameraUsageDescription: Nino does not use the camera. The video library used for Xbox streaming includes camera support, which stays off.
        # Samsung girişi sayfası jetonu bu telefondaki http://localhost:4794'e gönderir; TV'lerle düz HTTP konuşulur.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
        # Config/App.xcconfig + Secrets.xcconfig'ten (bkz. AppConfig.swift).
        CSPacksBaseURL: $(PACKS_API_BASE_URL)
    entitlements:
      path: CouchSubs/CouchSubs.entitlements
      # Nino: şimdilik boş (aşağıdaki multicast yetkisi Apple onayı bekliyor).
      properties: {}
        # PS5 ve TV'yi ağda bulmak (UDP yayını, SSDP) bu yetkiyi ister; Apple'dan ayrıca istenir
        # (developer.apple.com/contact/request/networking-multicast). Onay gelene kadar cihaz imzası için
        # bu satır kaldırılır ve PS5/TV adresi elle yazılır (docs/ios-plan.md).
        # Nino: Apple onayı gelene kadar kapalı (App Store derlemesi bu yetkiyle imzalanamaz). Onay gelince geri açın.
        # com.apple.developer.networking.multicast: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninotranslator.ios
        PRODUCT_NAME: Nino
        # Kodun modül adı aynı kalır (testler "@testable import CouchSubs" der).
        PRODUCT_MODULE_NAME: CouchSubs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone ve iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  CouchSubsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CouchSubsTests
    dependencies:
      - target: CouchSubs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninotranslator.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nino.app/Nino"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CouchSubs:
    build:
      targets:
        CouchSubs: all
        CouchSubsTests: [test]
    test:
      targets:
        - CouchSubsTests
